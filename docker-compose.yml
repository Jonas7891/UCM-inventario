services:

  postgres:
    image: postgres:16
    container_name: ucm-inventario-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: inventario_user
      POSTGRES_PASSWORD: inventario_pass
      POSTGRES_DB: inventario

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - inventario-network


  inventario-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ucm-inventario-api

    restart: unless-stopped

    environment:
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventario
      DB_USER: inventario_user
      DB_PASSWORD: inventario_pass

    ports:
      - "3000:3000"

    depends_on:
      - postgres

    volumes:
      - ./data:/app/data

    networks:
      - inventario-network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: ucm-inventario-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - inventario-api

    networks:
      - inventario-network


volumes:

  postgres_data:


networks:

  inventario-network:
    driver: bridge